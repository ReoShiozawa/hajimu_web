name: Build & Release hajimu_web

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suffix: macos
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: マニフェストv2を検証
        shell: bash
        run: |
          jq -e '.schema_version == 2 and (.name | type == "string") and (.version | type == "string") and (.entry | type == "string") and (.dependencies | type == "object")' hajimu.json >/dev/null

      - name: はじむヘッダーを取得
        uses: actions/checkout@v4
        with:
          repository: ReoShiozawa/hajimu
          path: _hajimu
          sparse-checkout: include

      - name: ヘッダーをコピー
        shell: bash
        run: mkdir -p include && cp -r _hajimu/include/. include/

      # ── Linux 依存ライブラリ ────────────────────────────
      - name: Linux 依存インストール
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y zlib1g-dev

      # ── macOS / Linux ─────────────────────────────────
      - name: ビルド (macOS / Linux)
        if: runner.os != 'Windows'
        run: make HAJIMU_INCLUDE=include

      # ── Windows (MSYS2 MINGW64) ───────────────────────
      - name: MSYS2 セットアップ (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib make

      - name: ビルド (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make HAJIMU_INCLUDE=include

      # ── アーティファクト整理 ────────────────────────────
      - name: アーティファクトをリネーム
        shell: bash
        run: |
          mkdir -p dist
          cp hajimu_web.hjp dist/hajimu_web-${{ matrix.suffix }}.hjp

      - name: チェックサム生成
        shell: bash
        run: |
          for file in dist/*.hjp; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done

      - name: CI アーティファクト保存
        uses: actions/upload-artifact@v4
        with:
          name: hajimu_web-${{ matrix.suffix }}
          path: dist/
      - name: Sign build provenance and SBOM
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/release-integrity
        with:
          subject-path: dist/*.hjp
          artifact-name: sbom-${{ matrix.suffix }}

      - name: GitHub Releases にアップロード
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
